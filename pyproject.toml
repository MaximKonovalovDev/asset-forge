[project]
name = "asset-forge"
version = "0.0.1"
description = "AI-driven game asset pack creation pipeline. Proprietary, flax-game-studio."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "flax-game-studio" }]

dependencies = [
    # Core
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "tenacity>=9.0",
    "typer>=0.13",
    "rich>=13.9",
    "structlog>=24.4",
    "pyyaml>=6.0",
    # MCP client (talks to flax-mcp)
    "websockets>=13.0",
    # LLM
    "anthropic>=0.40",
    "openai>=1.50",
    # Image / preview
    "pillow>=10.4",
    "numpy>=2.0",
    # 3D / gltf
    "pygltflib>=1.16",
    # Static site (showroom)
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.115",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[project.scripts]
asset-forge = "asset_forge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asset_forge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
